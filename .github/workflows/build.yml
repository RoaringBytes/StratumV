name: Build StratumV

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Windows (VS 2022, Release)
    runs-on: windows-2022

    steps:
      - uses: actions/checkout@v7

      - name: Cache FetchContent dependencies
        uses: actions/cache@v6
        with:
          path: build/_deps
          # The cached _deps tree holds COMPILED artifacts (e.g. glslang's
          # precompiled header). Reusing them across a Windows-image / MSVC
          # bump triggers "error C1853: precompiled header file is from a
          # different version of the compiler". Keying on the runner image
          # version makes an image update bust the cache automatically, and
          # restore-keys is scoped to the same image so a stale-compiler
          # cache is never used as a fallback.
          key: fetchcontent-${{ runner.os }}-${{ env.ImageVersion }}-${{ hashFiles('CMakeLists.txt') }}
          restore-keys: |
            fetchcontent-${{ runner.os }}-${{ env.ImageVersion }}-

      - name: Configure CMake
        run: >
          cmake -B build
          -G "Visual Studio 17 2022" -A x64
          -DSTRATUMV_BUILD_TESTS=ON
          -DSTRATUMV_ENABLE_DLSS=OFF
          -DSTRATUMV_ENABLE_SHARC=OFF
          -DSTRATUMV_ENABLE_NTC=OFF

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Run tests
        # CPU-side unit suite. Golden-image (GPU) tests stay opt-in via
        # STRATUMV_GOLDEN_TESTS and never run on hosted runners.
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Verify library output
        shell: pwsh
        run: |
          if (!(Test-Path "build/Release/stratumv.lib")) {
            Write-Error "stratumv.lib not found"
            exit 1
          }
          $size = (Get-Item "build/Release/stratumv.lib").Length / 1MB
          Write-Host "stratumv.lib size: $([math]::Round($size, 1)) MB"

      - name: Verify engine_ref tooling
        run: python tools/engine_ref.py

  # ── Linux core-only build (stratumv_core + stratumv_server) ──
  # Builds the Layer 4 networking + replication carve-out on Ubuntu
  # against a provisioned MsQuic 2.5.8 (headers + libmsquic.so). The resulting
  # stratumv_server.exe (Linux ELF) is the same binary the Linux server
  # deployment would run. No Vulkan, glslang, glm, ozz, or ImGui on
  # this path — if any of those creep in the configure fails because
  # their FetchContent blocks are gated on NOT STRATUMV_CORE_ONLY.
  linux-core:
    name: Linux (Ubuntu 22.04, stratumv_core carve-out)
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v7

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            ninja-build \
            pkg-config \
            libssl-dev

      - name: Provision MsQuic (headers from source tag, .so from packages.microsoft.com)
        # Upstream stopped attaching Linux prebuilt tarballs to GitHub
        # releases (v2.5.6's assets are gone entirely — see issue #12),
        # so the old release-asset download 404s. Instead: headers come
        # from a sparse checkout of the pinned source tag, the runtime
        # .so comes from Microsoft's apt repo (libmsquic). This step is
        # gating on purpose — if provisioning breaks we want a red X.
        run: |
          set -euxo pipefail
          MSQUIC_TAG=v2.5.8   # keep in sync with the Windows NuGet pin in CMakeLists.txt
          ROOT=${{ github.workspace }}/msquic
          mkdir -p "$ROOT/include" "$ROOT/bin"
          # Headers: sparse checkout of src/inc at the pinned tag
          git clone --depth 1 --branch "$MSQUIC_TAG" --filter=blob:none --sparse \
            https://github.com/microsoft/msquic msquic-src
          git -C msquic-src sparse-checkout set src/inc
          cp msquic-src/src/inc/*.h "$ROOT/include/"
          # Runtime: libmsquic from packages.microsoft.com (2.5.x line)
          curl -fsSL https://packages.microsoft.com/config/ubuntu/22.04/packages-microsoft-prod.deb -o pmp.deb
          sudo dpkg -i pmp.deb
          sudo apt-get update
          apt-get download libmsquic
          dpkg-deb -x libmsquic_*_amd64.deb pkg
          cp -a pkg/usr/lib/x86_64-linux-gnu/libmsquic.so* "$ROOT/bin/" \
            || cp -a pkg/usr/lib/libmsquic.so* "$ROOT/bin/"
          ls -la "$ROOT/bin" "$ROOT/include"

      - name: Configure CMake (STRATUMV_CORE_ONLY=ON)
        run: >
          cmake -B build
          -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DSTRATUMV_CORE_ONLY=ON
          -DSTRATUMV_BUILD_TESTS=ON
          -DSTRATUMV_LINUX_MSQUIC_ROOT=${{ github.workspace }}/msquic

      - name: Build stratumv_core + stratumv_server + sv_tests
        run: cmake --build build --parallel

      - name: Verify stratumv_core.a and stratumv_server outputs
        shell: bash
        run: |
          set -eu
          if [ ! -f build/libstratumv_core.a ]; then
            echo "libstratumv_core.a not found" >&2
            exit 1
          fi
          if [ ! -f build/src/stratumv_server/stratumv_server ]; then
            echo "stratumv_server exe not found" >&2
            exit 1
          fi
          ls -la build/libstratumv_core.a build/src/stratumv_server/stratumv_server

      - name: Run core ctest subset
        working-directory: build
        env:
          LD_LIBRARY_PATH: ${{ github.workspace }}/msquic/bin:${{ github.workspace }}/msquic/lib
        run: ctest --output-on-failure
